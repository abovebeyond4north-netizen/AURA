[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "aura-omega"
version = "0.1.0"
description = "Bounded research prototype for self-supervised world models and verified improvement"
requires-python = ">=3.11"
dependencies = ["torch==2.10.0", "numpy==2.3.5", "scipy==1.17.0", "gymnasium==1.2.2", "pydantic==2.13.5", "PyYAML==6.0.3", "matplotlib==3.10.8", "tensorboard==2.20.0"]
[project.optional-dependencies]
dev = ["pytest==9.0.2"]
[tool.setuptools.packages.find]
include = ["aura*", "protected_verifier*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
